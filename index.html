h1{position:absolute;top:48px;left:400px;right:110px;margin:0;text-align:center;font:700 44px/1.3 'Amiri',serif;color:var(--wine)}
.sub{position:absolute;top:118px;left:400px;right:110px;text-align:center;font-size:21px;color:#6b4a53}
.card{position:absolute;width:360px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid #9a6a76;border-radius:14px;font:700 28px 'Amiri',serif;box-shadow:0 4px 10px rgba(80,30,45,.18);cursor:pointer;touch-action:none;transition:background .2s,border-color .2s,transform .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--wine);background:#f3e2e5}
.card.ok{background:#e4f1e7;border-color:var(--ok);cursor:default}
.card.shake{animation:sh .4s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.dot{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--wine);border:3px solid var(--card)}
.s .dot{left:-10px}.t .dot{right:-10px}
.card.ok .dot{background:var(--ok)}
svg{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
line{stroke-width:5;stroke-linecap:round}
#bar{position:absolute;left:230px;bottom:62px;display:flex;gap:18px;align-items:center;font-size:22px}
#reset{font:700 20px 'Tajawal',sans-serif;background:var(--wine);color:#fff;border:0;border-radius:10px;padding:8px 22px;cursor:pointer}
canvas{position:absolute;inset:0;pointer-events:none}

<body>
<div id="wrap"><div id="stage">
<h1>التشابه في قصة لوط</h1>
<div class="sub">صِل اسم السورة بالآية المناسبة: اسحب من السورة إلى الآية</div>
<svg id="svg"></svg>
<div id="bar"><span id="score">0 / 4</span><button id="reset">إعادة اللعبة</button></div>
<canvas id="cv" width="1280" height="720"></canvas>
</div></div>
<script>
const data=[{s:'الأعراف',t:'كانت من الغابرين'},{s:'الحجر',t:'قدرنا إنها لمن الغابرين'},{s:'النمل',t:'قدرناها من الغابرين'},{s:'العنكبوت',t:'كانت من الغابرين'}];
const stage=document.getElementById('stage'),svg=document.getElementById('svg'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scale=1,cards=[],done=0,pending=null,drag=null,temp=null,parts=[],anim=null;
function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform='scale('+scale+')'}
addEventListener('resize',()=>{fit();redraw()});fit();
function pos(el){const r=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return[(r.left+r.width/2-b.left)/scale,(r.top+r.height/2-b.top)/scale]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
 cards.forEach(c=>c.remove());cards=[];svg.innerHTML='';done=0;pending=null;
 document.getElementById('score').textContent='0 / 4';
 cancelAnimationFrame(anim);ctx.clearRect(0,0,1280,720);
 const order=shuffle(data.map((_,i)=>i));
 data.forEach((d,i)=>mk('s',i,'سورة '+d.s,700,185+i*92));
 order.forEach((k,i)=>mk('t',k,'﴿'+data[k].t+'﴾',220,185+i*92));
}
function mk(side,idx,txt,x,y){
 const c=document.createElement('div');c.className='card '+side;c.textContent=txt;
 c.style.left=x+'px';c.style.top=y+'px';c.dataset.side=side;c.dataset.idx=idx;
 const d=document.createElement('i');d.className='dot';c.appendChild(d);
 c.addEventListener('pointerdown',e=>{if(c.classList.contains('ok'))return;e.preventDefault();drag=c;});
 stage.appendChild(c);cards.push(c);
}
function line(a,b,col,id){
 const[p,q]=[pos(a.querySelector('.dot')),pos(b.querySelector('.dot'))];
 const l=document.createElementNS('http://www.w3.org/2000/svg','line');
 l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',q[0]);l.setAttribute('y2',q[1]);l.setAttribute('stroke',col);
 if(id)l.dataset.pair=id;svg.appendChild(l);return l;
}
function redraw(){const L=[...svg.querySelectorAll('line[data-pair]')];svg.innerHTML='';L.forEach(l=>{const[a,b]=l.dataset.pair.split('|').map(i=>cards[+i]);line(a,b,'#2f7d4f',l.dataset.pair)})}
function tryConnect(a,b){
 if(a.dataset.side===b.dataset.side)return;
 const s=a.dataset.side==='s'?a:b,t=a===s?b:a;
 const ok=data[+s.dataset.idx].t===data[+t.dataset.idx].t&&s.dataset.idx===s.dataset.idx&&data[+s.dataset.idx].t===data[+t.dataset.idx].t;
 if(ok){
  s.classList.add('ok');t.classList.add('ok');
  line(s,t,'#2f7d4f',cards.indexOf(s)+'|'+cards.indexOf(t));
  document.getElementById('score').textContent=(++done)+' / 4';
  if(done===4)win();
 }else{
  const l=line(s,t,'#b3262e');[s,t].forEach(c=>c.classList.add('shake'));
  setTimeout(()=>{l.remove();[s,t].forEach(c=>c.classList.remove('shake'))},600);
 }
}
addEventListener('pointermove',e=>{
 if(!drag)return;
 const b=stage.getBoundingClientRect(),p=pos(drag.querySelector('.dot'));
 if(!temp){temp=document.createElementNS('http://www.w3.org/2000/svg','line');temp.setAttribute('stroke','#7a2a3d');temp.setAttribute('stroke-dasharray','8 8');svg.appendChild(temp)}
 temp.setAttribute('x1',p[0]);temp.setAttribute('y1',p[1]);temp.setAttribute('x2',(e.clientX-b.left)/scale);temp.setAttribute('y2',(e.clientY-b.top)/scale);
});
addEventListener('pointerup',e=>{
 if(!drag)return;
 if(temp){temp.remove();temp=null}
 const el=document.elementFromPoint(e.clientX,e.clientY),tg=el&&el.closest&&el.closest('.card');
 const from=drag;drag=null;
 if(tg&&tg!==from&&!tg.classList.contains('ok')){if(pending)pending.classList.remove('sel');pending=null;tryConnect(from,tg)}
 else if(tg===from){
  if(pending&&pending!==from&&pending.dataset.side!==from.dataset.side){pending.classList.remove('sel');const p=pending;pending=null;tryConnect(p,from)}
  else if(pending===from){from.classList.remove('sel');pending=null}
  else{if(pending)pending.classList.remove('sel');pending=from;from.classList.add('sel')}
 }
});
function win(){
 const cols=['#7a2a3d','#d94f6b','#e8b04a','#2f7d4f','#4a7fd9','#fff'];
 const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=6+Math.random()*10;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:Math.random()*.4-.2,c:cols[Math.random()*cols.length|0],life:150+Math.random()*60})}};
 [[320,360],[640,300],[960,360],[500,200],[780,200]].forEach(([x,y],i)=>setTimeout(()=>burst(x,y,70),i*350));
 setTimeout(()=>{for(let i=0;i<4;i++)setTimeout(()=>burst(Math.random()*1280,100+Math.random()*300,50),i*300)},1800);
 const step=()=>{
  ctx.clearRect(0,0,1280,720);
  parts=parts.filter(p=>p.life>0&&p.y<760);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
  if(parts.length||done===4)anim=requestAnimationFrame(step);
 };
 cancelAnimationFrame(anim);step();
 setTimeout(()=>{done=-1},6000);
}
document.getElementById('reset').onclick=()=>{parts=[];build()};
build();
</script>
</body>
</html>
